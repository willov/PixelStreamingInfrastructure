<!-- UI-less Pixel Streaming player for the movement analysis avatar. -->
<!DOCTYPE HTML>
<html style="width: 100%; height: 100%">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Avatar</title>
    <style>
        html, body { margin: 0; background: #000; overflow: hidden; }
        /* Status text on top of the video: connecting, waiting for a free slot, session ended. */
        #status {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; align-items: center; justify-content: center; text-align: center;
            color: #fff; font-family: sans-serif; font-size: 1.2rem; padding: 1rem; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.6); cursor: pointer; z-index: 10;
        }
        #status.visible { display: flex; }
    </style>
</head>
<body style="width: 100vw; height: 100vh; min-height: -webkit-fill-available;">
    <div id="videoParentElement"></div>
    <div id="status"></div>
</body>
</html>
